<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/signup.js"></script>
    <script src="../js/session.js"></script>
</head>
<body>
    <div class="grid grid-cols-1 md:grid-cols-2 min-h-screen overflow-hidden">
    
    <!-- Left Section -->
    <div class="flex flex-col items-center justify-center gap-y-6 px-4 sm:px-6 md:px-8 py-8">
        
        <div class="flex gap-1">
            <img src="images/logo.png" alt="logo" class="w-8 sm:w-10" />
            <div class="flex">
                <h1 class="text-2xl sm:text-3xl font-semibold">Share</h1>
                <h1 class="text-2xl sm:text-3xl text-blue-600 font-semibold">Kit</h1>
            </div>
        </div>

        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-center">New User !</h1>
        
        <p class="text-base sm:text-lg text-gray-500 text-center px-2">
            Create your account for using our services
        </p>

        <form class="w-full sm:w-4/6 space-y-4 sm:space-y-6" onsubmit="signup(event)">
            <input name="fullname" class="p-3 sm:p-4 border border-gray-300 rounded-lg w-full" placeholder="Fullname" required />
            <input name="email" class="p-3 sm:p-4 border border-gray-300 rounded-lg w-full" placeholder="Email" required />
            <input name="password" type="password" class="p-3 sm:p-4 border border-gray-300 rounded-lg w-full" placeholder="Password" required />
            
            <button class="p-3 sm:p-4 bg-gray-900 rounded-lg text-white font-semibold w-full">
                Sign Up
            </button>
        </form>

        <div class="text-center">
            <label class="text-gray-600 text-sm sm:text-base">
                I already have an account
            </label>
            <a href="/login.html" class="text-blue-600 text-sm sm:text-base font-medium">
                Sign In ?
            </a>
        </div>
    </div>

    <!-- Right Section (Image) -->
    <div class="hidden md:block h-full">
        <img src="images/login-bg.jpg" alt="login-bg" class="w-full h-full object-cover" />
    </div>

</div>
</body>
</html>
