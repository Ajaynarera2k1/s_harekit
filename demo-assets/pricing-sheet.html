<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #111827;
    }
    table {
      border-collapse: collapse;
      min-width: 520px;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 12px;
      text-align: left;
    }
    th {
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <h1>ShareKit Demo Pricing Sheet</h1>
  <table>
    <thead>
      <tr>
        <th>Plan</th>
        <th>Storage</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Starter</td>
        <td>200 MB</td>
        <td>Free</td>
      </tr>
      <tr>
        <td>Pro</td>
        <td>2 GB</td>
        <td>Rs. 499</td>
      </tr>
      <tr>
        <td>Corporate</td>
        <td>10 GB</td>
        <td>Rs. 1,800</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
